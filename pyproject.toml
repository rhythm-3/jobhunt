[project]
name = "jobagent"
version = "0.1.0"
description = "Autonomous multi-agent job search & application system with human-in-the-loop controls"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
prod = ["anthropic>=1.0", "psycopg[binary]", "pgvector", "temporalio", "playwright", "weasyprint", "jinja2",
        "opentelemetry-sdk", "opentelemetry-exporter-otlp", "langfuse", "hvac", "redis", "httpx"]
