<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1126">
<title>OfferPilot</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<link rel="stylesheet" href="/static/deck.css">
<script>/* apply the saved mode before first paint: no flash */(function(){var r=document.documentElement,t="dark";try{var s=localStorage;if(s.getItem("ui_v")!=="5"){s.setItem("ui_v","5");s.setItem("theme","dark")}t=s.getItem("theme")==="light"?"light":"dark"}catch(e){}r.dataset.theme=t;r.dataset.ui="deck";try{r.dataset.side=localStorage.getItem("side")==="rail"?"rail":"open";var a=JSON.parse(localStorage.getItem("a11y")||"{}");r.dataset.fx=a.motion?"off":a.fx==="calm"?"calm":"full";if(a.motion)r.dataset.motion="reduce"}catch(e){r.dataset.side="open";r.dataset.fx="full"}})();</script>
</head>
<body>
<noscript>OfferPilot needs JavaScript.</noscript>
<script src="/static/brand.js"></script>
<script src="/static/fx.js" defer></script>
<script src="/static/charts.js" defer></script>
<script src="/static/app.js" defer></script>
<script src="/static/visuals.js" defer></script>
<script src="/static/toolkit.js" defer></script>
<script src="/static/outreach.js" defer></script>
<script src="/static/pro.js" defer></script>
<script src="/static/interact.js" defer></script>
<script src="/static/assistant.js" defer></script>
</body>
</html>
